name: cortiq-hermes-router
version: 0.5.2
description: "AllaiGate model routing for Hermes — inexpensive models for simple tasks, stronger models for complex work. Classifies every call of a turn — the user's message, then each tool step's output — (POST /v1/route), picks a model from your tiers/taskRules and rewrites the outgoing request via llm_request middleware. Tier entries can point at their own endpoint (Ollama, LM Studio, vLLM, llama.cpp, CMF/cortiq, cloud) run by llm_execution with fail-open. Config: ~/.config/cortiq-hermes-router/config.json, key: CORTIQ_ROUTER_KEY."
author: "infosave2007 (Cortiq Team)"
requires_env:
  - name: CORTIQ_ROUTER_KEY
    description: "AllaiGate classifier key. Free: enter your email and the promo code LAUNCH1 on the site, and the key arrives by email."
    url: https://api.allaigate.com/
    secret: true
provides_middleware:
  - llm_request
  - llm_execution
capabilities:
  - llm.model_override
  - llm.provider_override